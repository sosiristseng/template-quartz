name: Deploy to GitHub pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history, so page dates come from commits
          persist-credentials: false # the build never pushes
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Strip Protocol from URL
        id: clean_url
        run: |
          # Get the raw URL (e.g., https://github.io)
          RAW_URL="${{ steps.pages.outputs.base_url }}"

          # Strip both http:// and https:// prefixes
          CLEANED_URL="${RAW_URL#http:///}"
          CLEANED_URL="${CLEANED_URL#https://}"

          # Save it to the environment output
          echo "stripped_url=$CLEANED_URL" >> $GITHUB_OUTPUT
      - name: Autoset baseUrl
        run: yq -i '.configuration.baseUrl = "${{ steps.clean_url.outputs.stripped_url }}"' quartz.config.yaml
      - name: Read Quartz version
        id: quartz_version
        run: echo "sha=$(cat quartz.version)" >> "$GITHUB_OUTPUT"
      - name: Build website
        id: quartz
        uses: raven-wing/quartz-action@v0
        with:
          quartz-version: ${{ steps.quartz_version.outputs.sha }}
          config: quartz.config.yaml
          content-dir: content
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.quartz.outputs.output-dir }}

  # Deployment job
  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main'}}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      actions: read # to download an artifact uploaded by `actions/upload-pages-artifact`
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
